[project]
name = "gem-reviewer"
version = "0.1.0"
description = "Reproducible, provenance-preserving review workflow for immutable GEM inputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cobra>=0.32,<0.33",
    "fire>=0.7,<0.8",
    "memote==0.17.0",
]

[project.scripts]
gem-review = "gem_reviewer.cli:main"
gem-count = "gem_reviewer.entity_counts:main"
gem-preflight = "gem_reviewer.preflight_cli:main"
gem-memote-baseline = "gem_reviewer.memote_baseline_cli:main"
gem-memote-summarize = "gem_reviewer.memote_summary_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
